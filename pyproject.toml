[project]
name = "doc2sys"
authors = [
    { name = "KAINOTOMO PH LTD", email = "info@kainotomo.com"}
]
description = "A document automation software that extracts data from various files (images, PDFs etc), validates them, and integrates them into accounting systems, deployable both in the cloud and on-premises."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "requests>=2.28.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-core>=1.24.0",
    "pdf2image>=1.16.0",
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "pytesseract>=0.3.10",
    "Pillow>=8.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
